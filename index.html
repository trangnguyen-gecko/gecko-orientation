<style>
:root{--g:#00A24D;--gd:#007d3b;--b:#54413D;--mut:#6b6b6b;--line:#e6e6e2;--red:#c62828}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Be Vietnam Pro",Calibri,Arial,sans-serif;color:#1f1f1f;background:linear-gradient(135deg,#00A24D 0%,#007d3b 60%,#54413D 140%);display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:420px;padding:34px 32px 28px;text-align:center}
.box img{height:52px;margin-bottom:10px}
h1{font-size:19px;margin:6px 0 2px;color:var(--b);letter-spacing:1px;text-transform:uppercase}
.sub{color:var(--mut);font-size:14px;margin:0 0 22px}
label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--b);margin:12px 0 4px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--g)}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--red)}
.help{margin-top:18px;font-size:13px;color:var(--mut);line-height:1.5}
.help b{color:var(--gd)}
.pw{position:relative}.pw span{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:13px;color:var(--mut)}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('eye').onclick=()=>{const p=document.getElementById('p');p.type=p.type==='password'?'text':'password';document.getElementById('eye').textContent=p.type==='password'?'Hiện':'Ẩn';};
async function decrypt(key){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(key),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},k,b(CT));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const m=document.getElementById('m'), btn=document.getElementById('go');
  const user=document.getElementById('u').value.trim(), pass=document.getElementById('p').value;
  if(!user||!pass){m.textContent='Nhập tên đăng nhập và mật khẩu.';return;}
  if(!API){m.textContent='Trang chưa được nối với hệ thống tài khoản (thiếu API).';return;}
  btn.disabled=true; m.style.color='#6b6b6b'; m.textContent='Đang kiểm tra…';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'login',user,pass})});
    const j=await r.json();
    if(!j.ok){m.style.color='#c62828';m.textContent=j.msg||'Đăng nhập thất bại.';btn.disabled=false;return;}
    const html=await decrypt(j.key);
    sessionStorage.setItem('gecko_session',JSON.stringify({user,pass,name:j.name,pos:j.pos,role:j.role,site:j.site,isAdmin:!!j.isAdmin,expiry:j.expiry,api:API}));
    document.open();document.write(html);document.close();
  }catch(err){m.style.color='#c62828';m.textContent='Không kết nối được. Kiểm tra mạng rồi thử lại.';btn.disabled=false;}
});
// tự vào lại nếu còn phiên (đóng tab là hết)
(async()=>{try{const s=JSON.parse(sessionStorage.getItem('gecko_session')||'null');if(s&&s.api===API){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'login',user:s.user,pass:s.pass})});const j=await r.json();if(j.ok){const html=await decrypt(j.key);document.open();document.write(html);document.close();}}}catch(e){}})();
</script>
